<!--
  The rail is the app's navigation again.

  It was reduced to branding-only when the dashboard collapsed to a single page,
  on the reasoning that three sidebar tabs carried all the navigation there was.
  rochit asked for the three views to read as three destinations instead, so they
  are back here as icon buttons — but they still switch IN PLACE, without a
  reload. A real page load per view would refetch /api/analytics/meta, rebuild
  every layer and throw away the map position, which is 2-3 seconds each way for
  no gain. `showTab()` swaps the panel and pushes the URL, so the address bar,
  the back button and a bookmarked /gaps all behave like separate pages while the
  data and the viewport survive.

  Each button carries an icon AND a word. At 56px the word is tiny, but a rail of
  three unlabelled glyphs is a memory test, and "which one was the van again"
  is not a question a judge should have to answer.
-->
<nav class="icon-rail" aria-label="Views">
  <a
    class="rail-brand-link"
    href="{{ url_for('network_analytics_view') }}"
    title="Rehabilitation Bioengineering Group — IIT Madras"
  >
    <img class="rail-brand" src="{{ url_for('static', filename='images/rbg-logo.png') }}" alt="RBG IIT Madras logo" />
  </a>

  <div class="rail-divider" role="presentation"></div>

  <button
    type="button"
    class="rail-btn{% if active_tab == 'proximity' %} active{% endif %}"
    data-tab="proximity"
    data-path="/proximity"
    aria-label="Proximity — nearest hospital to each accident grid"
    title="Proximity — nearest hospital to each accident grid"
  >
    <span class="rail-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.2" />
        <circle cx="12" cy="12" r="3.6" />
        <path d="M12 1.6v2.6M12 19.8v2.6M1.6 12h2.6M19.8 12h2.6" />
        <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none" />
      </svg>
    </span>
    <span class="rail-label">Proximity</span>
  </button>

  <button
    type="button"
    class="rail-btn{% if active_tab == 'gaps' %} active{% endif %}"
    data-tab="gaps"
    data-path="/gaps"
    aria-label="Gaps — grids with no hospital of a given level in reach"
    title="Gaps — grids with no hospital of a given level in reach"
  >
    <span class="rail-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.8" y="2.8" width="7.4" height="7.4" rx="1.4" />
        <rect x="13.8" y="2.8" width="7.4" height="7.4" rx="1.4" />
        <rect x="2.8" y="13.8" width="7.4" height="7.4" rx="1.4" />
        <!-- the missing cell: dashed, with a cross. A gap is an absence, so the
             fourth square is drawn as one that is not there. -->
        <rect x="13.8" y="13.8" width="7.4" height="7.4" rx="1.4" stroke-dasharray="2.6 2.2" />
        <path d="M16.1 16.1l2.8 2.8M18.9 16.1l-2.8 2.8" />
      </svg>
    </span>
    <span class="rail-label">Gaps</span>
  </button>

  <button
    type="button"
    class="rail-btn{% if active_tab == 'ambulance' %} active{% endif %}"
    data-tab="ambulance"
    data-path="/ambulances"
    aria-label="Ambulances — grids beyond reach of the nearest vehicle"
    title="Ambulances — grids beyond reach of the nearest vehicle"
  >
    <span class="rail-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M1.8 16.2V8.4A1.5 1.5 0 0 1 3.3 6.9h9.5v9.3H1.8Z" />
        <path d="M12.8 10h3.5l3.9 3.9v2.3h-7.4" />
        <circle cx="6.6" cy="18.2" r="1.9" />
        <circle cx="16.8" cy="18.2" r="1.9" />
        <path d="M7.2 11.4h2.6M8.5 10.1v2.6" />
      </svg>
    </span>
    <span class="rail-label">Ambulance</span>
  </button>
</nav>
