# Host nginx site for the pm2 deployment: this nginx serves the static assets
# from disk and proxies everything else to gunicorn on 127.0.0.1:5050.
#
#     sudo cp nginx/tcga-host.conf /etc/nginx/sites-available/tcga
#     sudo ln -sf /etc/nginx/sites-available/tcga /etc/nginx/sites-enabled/tcga
#     sudo nginx -t && sudo systemctl reload nginx
#
# There is no frontend container in this arrangement — do not also run
# `docker compose up -d frontend`, or two things fight over the same job.

server {
    listen 80;
    server_name tcg.coers.in;
    # Leave this block plain HTTP and let certbot add the TLS one:
    #     sudo certbot --nginx -d tcg.coers.in

    # Accident CSV uploads exceed nginx's 1 MB default.
    client_max_body_size 20m;

    # Every payload this app serves is highly repetitive JSON — the analytics
    # coverage response is several MB and compresses roughly 10x.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/csv text/plain text/css application/javascript image/svg+xml;

    # Assets published by scripts/deploy_static.sh. Served straight off disk so
    # they never occupy one of gunicorn's four workers — this page pulls a dozen
    # per load, and a single analytics response can hold a worker for a minute.
    location /static/ {
        root /var/www/html;
        access_log off;
        expires 1h;
        add_header Cache-Control "public";
        # Missing asset: fall back to Flask, which still knows how to serve it.
        # Catches a deploy where the code was pulled but deploy_static.sh was not
        # re-run — slower, but the page works instead of half-rendering.
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The page is rendered by Flask, and a district's first grid/road
        # analysis genuinely runs 1-2 minutes. nginx's 60s default would return
        # 504 on a request that is working perfectly.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Publishing the API under a path prefix instead? Uncomment, and set
    # API_BASE_PATH=/bkd in the backend's environment (ecosystem.config.js).
    # The trailing slash strips the prefix so Flask still sees /api/...
    #
    # location /bkd/ {
    #     proxy_pass http://127.0.0.1:5050/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 300s;
    #     proxy_send_timeout 300s;
    # }
}
