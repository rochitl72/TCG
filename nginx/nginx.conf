# Where the Flask app lives. On a single-box deploy this is the compose service
# name and nothing needs touching. To run the backend on its own machine, change
# this one line to that host (`server 10.0.3.12:5050;` or
# `server api.internal.example:5050;`) and rebuild the frontend image — no other
# line in this file moves, because everything below proxies through this name.
upstream tcga_backend {
    server backend:5050;
}

server {
    listen 80;
    # Accept any Host. This is the only server block, so it is the default
    # anyway; naming it explicitly means the stack also works on a bare IP,
    # a hackathon demo box or localhost without editing the config.
    server_name _;

    # Accident CSV uploads (dataset_manager.py) need more than nginx's 1MB
    # default, and the grid/road analyses can legitimately run for a while
    # on first load per district — match the timeouts to what the app
    # actually does instead of nginx's defaults.
    client_max_body_size 20m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Every payload this app serves is highly repetitive JSON — the analytics
    # coverage response is ~6 MB and the accident-reach files are ~200 MB. They
    # compress by roughly 10x, so this is the single cheapest win available on
    # first load. gzip_proxied any: responses come from the backend upstream.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/csv text/plain text/css application/javascript image/svg+xml;

    # CSS/JS/images are served straight off disk by nginx rather than being
    # proxied through gunicorn. Every static request that reaches the backend
    # occupies one of only four workers for the whole round trip, and this app
    # loads a dozen assets per page — on a shared demo box that is the
    # difference between a snappy first paint and a queue behind a 6 MB
    # analytics response. The directory is mounted read-only in
    # docker-compose.yml.
    location /static/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1h;
        add_header Cache-Control "public";
        # If an asset is missing from the mount, fall back to the backend
        # rather than 404 — Flask still knows how to serve it.
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://tcga_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The API under a path prefix, for an edge that routes by path rather than
    # by host: tcg.coers.in/bkd/... reaches the backend, everything else reaches
    # this container. The trailing slash on proxy_pass is doing the work — it
    # strips /bkd, so Flask still receives /api/analytics/coverage and not one
    # route in app.py changes. Point the browser at it by setting
    # API_BASE_PATH=/bkd on the backend; the page reads that and prefixes its
    # own requests. Same origin either way, so there is no CORS to configure.
    location /bkd/ {
        proxy_pass http://tcga_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /bkd;
    }

    location / {
        proxy_pass http://tcga_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
